# Cloudflare Worker - 意见反馈代理
# 代理 GitHub Issues API，保护 GH_TOKEN 不暴露在前端

name = "feedback"
main = "feedback.js"
compatibility_date = "2026-06-30"

workers_dev = true

routes = [
  { pattern = "jbbfilm.xyz/api*", zone_name = "jbbfilm.xyz" },
  { pattern = "edit.jbbfilm.xyz/*", zone_name = "jbbfilm.xyz" }
]

[observability]
enabled = true
head_sampling_rate = 1
