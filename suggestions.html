<h1 class="article-title">意见追踪</h1>
<div class="article-sub">所有功能建议、Bug 反馈和体验优化记录</div>

<div style="display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap">
  <span style="font-size:13px;color:var(--text2)">状态筛选：</span>
  <button class="issue-filter active" onclick="filterIssues('all')" style="padding:5px 12px;border:1px solid var(--border);border-radius:14px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-size:12px">全部</button>
  <button class="issue-filter" onclick="filterIssues('open')" style="padding:5px 12px;border:1px solid var(--border);border-radius:14px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-size:12px">🟢 开放</button>
  <button class="issue-filter" onclick="filterIssues('planned')" style="padding:5px 12px;border:1px solid var(--border);border-radius:14px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-size:12px">🔵 计划中</button>
  <button class="issue-filter" onclick="filterIssues('done')" style="padding:5px 12px;border:1px solid var(--border);border-radius:14px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-size:12px">🟣 已完成</button>
  <a href="/#feedback" style="margin-left:auto;font-size:13px;color:var(--link);white-space:nowrap">+ 提交新建议</a>
</div>

<div id="issueList" style="min-height:300px"></div>

</div>

<button class="video-close" onclick="closeVideo()">✕</button>

<video id="modalVideo" controls playsinline preload="none" onclick="event.stopPropagation()" onended="closeVideo()" style="display:none" oncanplay="document.getElementById('videoSpinner').style.display='none';this.style.display='block';this.play()"></video>
</div>

<script>
var _issues=[];
var _filter='all';

function statusBadge(s){
  var map={open:'🟢 开放',planned:'🔵 计划中',done:'🟣 已完成',closed:'🟣 已完成'};
  return '<span class="issue-status '+s+'">'+(map[s]||s)+'</span>';
}
function typeIcon(t){
  var map={'🆕功能':'🆕','🐛Bug':'🐛','💬其他':'💬'};
  return map[t]||'💬';
}

function renderIssues(){
  var list=_issues;
  if(_filter!=='all') list=_issues.filter(function(i){return i.status===_filter});
  var h='';
  if(list.length===0){
    h='<div style="text-align:center;padding:40px;color:var(--text2)">暂无匹配的建议</div>';
  }
  for(var i=0;i<list.length;i++){
    var item=list[i];
    var id='#'+item.id;
    h+='<div class="issue-item" style="border:1px solid var(--border-light);border-radius:6px;padding:16px 20px;margin-bottom:8px;background:var(--paper);cursor:pointer;transition:.15s" onclick="this.classList.toggle(\'expanded\')">';
    h+='<div style="display:flex;align-items:center;gap:10px">';
    h+='<span style="font-size:20px;flex-shrink:0">'+typeIcon(item.type)+'</span>';
    h+='<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px;color:var(--text)">'+item.title+'</div>';
    h+='<div style="display:flex;gap:10px;align-items:center;margin-top:4px;font-size:11px;color:var(--text2)">';
    h+=statusBadge(item.status);
    h+='<span>'+item.type+'</span>';
    h+='<span>'+item.priority+'</span>';
    h+='<span>'+item.author+' · '+item.date+'</span>';
    h+='</div></div>';
    h+='<span style="font-size:11px;color:var(--text2);flex-shrink:0">'+id+'</span>';
    h+='</div>';
    if(item.desc){
      h+='<div class="issue-desc" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light);font-size:13px;color:var(--text);line-height:1.6">'+item.desc+'</div>';
    }
    h+='</div>';
  }
  document.getElementById('issueList').innerHTML=h;
}

function filterIssues(f){
  _filter=f;
  document.querySelectorAll('.issue-filter').forEach(function(b){b.classList.remove('active')});
  event.target.classList.add('active');
  renderIssues();
}

// ── GitHub Issues API ──
function parseGHIssue(issue){
  var labels=issue.labels.map(function(l){return l.name});
  var title=issue.title||'';
  // 从标题前缀提取类型 [🆕功能] / [🐛Bug] / [💬其他]
  var type='💬其他';
  var m=title.match(/^\[(.+?)\]\s*/);
  if(m){
    var tag=m[1];
    if(tag.indexOf('Bug')>=0)type='🐛Bug';
    else if(tag.indexOf('功能')>=0)type='🆕功能';
    else if(tag.indexOf('其他')>=0)type='💬其他';
    title=title.substring(m[0].length); // 去掉前缀
  } else {
    // fallback: 从 label 判断
    if(labels.indexOf('bug')>=0)type='🐛Bug';
    else if(labels.indexOf('enhancement')>=0)type='🆕功能';
    else if(labels.indexOf('question')>=0)type='💬其他';
  }
  var priority='';
  var status='open';
  if(issue.state==='closed')status='done';
  else if(labels.indexOf('planned')>=0)status='planned';
  return {
    id:issue.number,
    type:type,
    title:title,
    desc:(issue.body||'').replace(/\n/g,'<br>'),
    priority:priority,
    status:status,
    author:issue.user?issue.user.login:'',
    date:issue.created_at?issue.created_at.substring(0,10):''
  };
}

function loadIssues(){
  document.getElementById('issueList').innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">加载中...</div>';
  fetch('/api?state=all&per_page=50')
  .then(function(r){return r.json()})
  .then(function(data){
    _issues=[];
    for(var i=0;i<data.length;i++){
      if(!data[i].pull_request) _issues.push(parseGHIssue(data[i]));
    }
    renderIssues();
  })
  .catch(function(){
    // Fallback to local JSON
    fetch('suggestions.json')
    .then(function(r){return r.json()})
    .then(function(d){_issues=d;renderIssues()})
    .catch(function(){document.getElementById('issueList').innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">加载失败，请刷新重试</div>'});
  });
}

loadIssues();
</script>
<script src="js/common.js"></script>
</body>
