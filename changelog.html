.cl-wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
.cl-header{border-bottom:1px solid var(--border-light);padding-bottom:16px;margin-bottom:8px}
.cl-header h1{font-size:24px;font-weight:400;margin-bottom:4px}
.cl-sub{font-size:14px;color:var(--text2)}
.cl-toolbar{display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-light);flex-wrap:wrap;position:sticky;top:56px;z-index:10;background:var(--bg)}
.cl-filter{border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:12px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-family:inherit;transition:.15s}
.cl-filter:hover{background:var(--infobox-header)}
.cl-filter.active{background:var(--link);color:#fff;border-color:var(--link)}
.cl-day{margin-top:24px}
.cl-day-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border-light)}
.cl-day-date{font-size:15px;font-weight:600;color:var(--text)}
.cl-day-count{font-size:12px;color:var(--text2)}
.cl-commit{display:flex;align-items:flex-start;gap:12px;padding:8px 12px;border-radius:4px;transition:background .2s,transform .2s;line-height:1.5}
.cl-commit:hover{background:var(--infobox-header);transform:translateX(4px)}
.cl-commit-hash{flex-shrink:0;font-family:monospace;font-size:11px;min-width:56px}
.cl-commit-hash a{color:var(--text2);text-decoration:none}
.cl-commit-hash a:hover{color:var(--link);text-decoration:underline}
.cl-badge{flex-shrink:0;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700;white-space:nowrap;line-height:18px;min-width:52px;text-align:center}
.cl-badge.feat{background:#ddf4e0;color:#1a6e2a}.dark .cl-badge.feat{background:#1a3820;color:#66bb6a}
.cl-badge.fix{background:#ffe8d6;color:#b85c05}.dark .cl-badge.fix{background:#3a2810;color:#ffa94d}
.cl-badge.perf{background:#dbeafe;color:#1a56b0}.dark .cl-badge.perf{background:#1a3050;color:#64b5f6}
.cl-badge.chore{background:var(--infobox-header);color:var(--text2)}
.cl-badge.docs{background:#f3e5f5;color:#6b1a8a}.dark .cl-badge.docs{background:#2a1a38;color:#b388ff}
.cl-commit-msg{flex:1;font-size:13px;color:var(--text);min-width:0;word-break:break-word}
.cl-pagination{display:flex;justify-content:center;gap:4px;margin-top:32px;padding-top:16px;border-top:1px solid var(--border-light)}
.cl-pagination button{border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:13px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-family:inherit}
.cl-pagination button:hover{background:var(--infobox-header)}
.cl-pagination button.active{background:var(--link);color:#fff;border-color:var(--link)}
.cl-pagination button:disabled{opacity:.4;cursor:default}
.cl-pagination .cl-page-info{display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--text2)}
.cl-empty{text-align:center;padding:48px 0;color:var(--text2);font-size:14px}
@media(max-width:640px){.cl-commit{padding:6px 8px;gap:6px}.cl-commit-hash{min-width:42px;font-size:10px}.cl-badge{min-width:40px;font-size:9px;padding:1px 4px}.cl-day-date{font-size:14px}}

<h1>更新日志</h1>

</div>
<div class="cl-toolbar">
<span style="font-size:12px;color:var(--text2);white-space:nowrap">类型：</span>
<button class="cl-filter active" data-type="all">全部</button>
<button class="cl-filter" data-type="feature">🆕 功能</button>
<button class="cl-filter" data-type="fix">🐛 修复</button>
<button class="cl-filter" data-type="improvement">🔧 改进</button>
<button class="cl-filter" data-type="chore">📦 杂项</button>
<div style="flex:1"></div>
<a href="#" onclick="loadAll(true)" style="font-size:12px;color:var(--link);white-space:nowrap">🔄 刷新</a>
<a href="https://github.com/rawetrip/rawetrip.github.io/commits/main" target="_blank" rel="noopener" style="font-size:12px;color:var(--link);white-space:nowrap">GitHub →</a>

<script src="js/common.js"></script>
<script>

var _all=[], _filter='all', _page=1, _perPage=5;
var _badgeMap={'feature':['feat','🆕功能'],'fix':['fix','🐛修复'],'improvement':['perf','🔧改进'],'chore':['chore','📦杂项'],'docs':['docs','📄文档'],'style':['style','🎨样式']};

function tagCommit(msg){
  var t=msg.includes(':')?msg.split(':')[0].toLowerCase():'';
  if(/^(feat|add |create|redesign)/i.test(t))return'feature';
  if(/^(fix|revert|remove)/i.test(t))return'fix';
  if(/^(perf|refactor|improve|optimize|tweak|switch|replace|rename|rewrite|reorder|compress|sort|update|make|user edits|link|restore)/i.test(t))return'improvement';
  if(/^docs/i.test(t))return'docs';
  if(/^style/i.test(t))return'style';
  if(/^merge/i.test(msg))return'chore';
  return'chore';
}

function parseCommits(commits){
  var days={};
  for(var i=0;i<commits.length;i++){
    var c=commits[i];
    var date=c.commit.author.date.substring(0,10);
    var h=c.sha.substring(0,7);
    var m=c.commit.message.split('\n')[0];
    if(!days[date])days[date]={date:date,count:0,commits:[]};
    days[date].commits.push({h:h,m:m,t:tagCommit(m)});
    days[date].count++;
  }
  return Object.keys(days).sort().reverse().map(function(d){return days[d]});
}

function fetchPage(pg,cb){
  var url='/api?type=commits&per_page=100&page='+(pg||1);
  fetch(url).then(function(r){return r.json()}).then(function(data){
    cb(data,data.length===100?pg+1:null);
  }).catch(function(){
    document.getElementById('clList').innerHTML='<div class="cl-empty">⚠ 加载失败，请刷新重试</div>';
  });
}

function loadAll(force){
  // 检查缓存 (20分钟有效)
  if(!force){
    try{
      var raw=localStorage.getItem('cl_cache');
      if(raw){
        var cache=JSON.parse(raw);
        if(Date.now()-cache.ts<1200000){
          _all=cache.data;
          var total=_all.reduce(function(s,d){return s+d.count},0);
          document.title='更新日志 · '+total+' commits — 喂鸡百科';
          var ago=Math.floor((Date.now()-cache.ts)/60000);
          document.getElementById('clSub').textContent=total+' commits · '+_all.length+' 天 · 缓存于 '+ago+' 分钟前';
          render();return;
        }
      }
    }catch(e){}
  }
  document.getElementById('clSub').textContent='加载中...';
  var all=[];
  function collect(data,nextPg){
    all=all.concat(data);
    if(nextPg&&all.length<500)fetchPage(nextPg,collect);
    else{
      _all=parseCommits(all);
      var total=_all.reduce(function(s,d){return s+d.count},0);
      document.title='更新日志 · '+total+' commits — 喂鸡百科';
      document.getElementById('clSub').textContent=total+' commits · '+_all.length+' 天 · 刚刚更新';
      // 写入缓存
      try{localStorage.setItem('cl_cache',JSON.stringify({ts:Date.now(),data:_all}))}catch(e){}
      render();
    }
  }
  fetchPage(1,collect);
}

function render(){
  var days=_all;
  if(_filter!=='all'){
    days=_all.map(function(d){
      var cs=d.commits.filter(function(c){return c.t===_filter});
      if(cs.length===0)return null;
      return {date:d.date,count:cs.length,commits:cs};
    }).filter(Boolean);
  }
  var totalDays=days.length;
  var totalCommits=days.reduce(function(s,d){return s+d.count},0);
  var totalPages=Math.ceil(totalDays/_perPage);
  if(_page>totalPages)_page=totalPages||1;
  var start=(_page-1)*_perPage;
  var pageDays=days.slice(start,start+_perPage);
  document.getElementById('clSub').textContent=totalCommits+' commits · '+totalDays+' 天';
  var h='';
  for(var i=0;i<pageDays.length;i++){
    var d=pageDays[i];
    h+='<div class="cl-day">';
    h+='<div class="cl-day-head"><span class="cl-day-date">'+d.date+'</span><span class="cl-day-count">'+d.count+' commits</span></div>';
    for(var j=0;j<d.commits.length;j++){
      var c=d.commits[j];
      var b=_badgeMap[c.t]||['chore','📦'];
      h+='<div class="cl-commit">';
      h+='<span class="cl-commit-hash"><a href="https://github.com/rawetrip/rawetrip.github.io/commit/'+c.h+'" target="_blank" rel="noopener">'+c.h+'</a></span>';
      h+='<span class="cl-badge '+b[0]+'">'+b[1]+'</span>';
      h+='<span class="cl-commit-msg">'+c.m+'</span>';
      h+='</div>';
    }
    h+='</div>';
  }
  document.getElementById('clList').innerHTML=h||'<div class="cl-empty">暂无匹配记录</div>';
  var ph='';
  ph+='<button '+(_page<=1?'disabled':'')+' onclick="goPage('+(_page-1)+')">← 之前</button>';
  for(var p=1;p<=totalPages;p++){
    if(totalPages<=7||p===1||p===totalPages||Math.abs(p-_page)<=2){
      ph+='<button class="'+(p===_page?'active':'')+'" onclick="goPage('+p+')">'+p+'</button>';
    } else if(p===2||p===totalPages-1){
      ph+='<span class="cl-page-info">...</span>';
    }
  }
  ph+='<button '+(_page>=totalPages?'disabled':'')+' onclick="goPage('+(_page+1)+')">之后 →</button>';
  document.getElementById('clPagination').innerHTML=ph;
  window.scrollTo({top:0,behavior:'smooth'});
}

function goPage(p){_page=p;render()}
function filterCL(t){_filter=t;_page=1;document.querySelectorAll('.cl-filter').forEach(function(b){b.classList.toggle('active',b.dataset.type===t)});render()}

loadAll();

(function(){
  var d=new Date(document.lastModified);
  document.getElementById('pageFooter').textContent='📅 最后更新于 '+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
})();

</script>
