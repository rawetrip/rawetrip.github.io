<div class="article-sub">记录喂鸡百科每次版本迭代的功能更新、优化改进和问题修复</div>

<!-- 筛选按钮 -->
<div style="display:flex;gap:8px;align-items:center;margin-bottom:24px;flex-wrap:wrap" id="filterBar">
  <span style="font-size:13px;color:var(--text2)">筛选：</span>
  <button class="cl-filter active" data-type="all" onclick="filterCL('all')">全部</button>
  <button class="cl-filter" data-type="feature" onclick="filterCL('feature')">🆕 新功能</button>
  <button class="cl-filter" data-type="improvement" onclick="filterCL('improvement')">🔧 改进</button>
  <button class="cl-filter" data-type="fix" onclick="filterCL('fix')">🐛 修复</button>
  <div style="flex:1"></div>
  <span style="font-size:12px;color:var(--text2)" id="clCount"></span>
</div>

<!-- 时间线 -->

</div>

<script src="js/common.js"></script>
<script>
// ── 加载 changelog ──
var _clData = [];
var _clFilter = 'all';

var _typeMap = {
  'feature':  { icon: '🆕', label: '新功能', cls: 'cl-feature'  },
  'improvement': { icon: '🔧', label: '改进',   cls: 'cl-improvement' },
  'fix':      { icon: '🐛', label: '修复',   cls: 'cl-fix'       }
};

function renderChangelog() {
  var h = '';
  var total = 0;
  for (var v = 0; v < _clData.length; v++) {
    var ver = _clData[v];
    var changes = ver.changes;
    if (_clFilter !== 'all') {
      changes = changes.filter(function(c) { return c.type === _clFilter; });
    }
    if (changes.length === 0) continue;

    total += changes.length;
    h += '<div class="cl-version">';
    h += '<div class="cl-ver-dot"><span></span></div>';
    h += '<div class="cl-ver-card">';
    h += '<div class="cl-ver-header">';
    h += '<span class="cl-ver-tag">v' + ver.version + '</span>';
    h += '<span class="cl-ver-date">' + ver.date + '</span>';
    h += '</div>';
    h += '<div class="cl-ver-title">' + ver.title + '</div>';
    h += '<div class="cl-change-list">';

    for (var i = 0; i < changes.length; i++) {
      var c = changes[i];
      var m = _typeMap[c.type] || _typeMap['feature'];
      h += '<div class="cl-change ' + m.cls + '">';
      h += '<span class="cl-change-icon">' + m.icon + '</span>';
      h += '<div class="cl-change-body">';
      h += '<div class="cl-change-text">' + c.text + '</div>';
      if (c.detail) {
        h += '<div class="cl-change-detail">' + c.detail + '</div>';
      }
      h += '</div>';
      h += '</div>';
    }

    h += '</div></div></div>';
  }

  document.getElementById('changelogTimeline').innerHTML = h || '<div style="text-align:center;padding:40px;color:var(--text2)">暂无此分类的更新记录</div>';
  document.getElementById('clCount').textContent = '共 ' + total + ' 条';
}

function filterCL(type) {
  _clFilter = type;
  document.querySelectorAll('.cl-filter').forEach(function(b) { b.classList.remove('active'); });
  var btn = document.querySelector('.cl-filter[data-type="' + type + '"]');
  if (btn) btn.classList.add('active');
  renderChangelog();
}

// ── 初始化 ──
fetch('changelog.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    _clData = data;
    renderChangelog();
  })
  .catch(function() {
    document.getElementById('changelogTimeline').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2)">⚠ 加载失败，请刷新重试</div>';
  });

// 页脚日期
(function(){
  var d = new Date(document.lastModified);
  document.getElementById('pageFooter').textContent = '📅 最后更新于 ' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
})();
</script>
