<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){var s=localStorage.getItem("theme");if(s!="dark")document.documentElement.className="light"})()</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>JBB FILM</title>
<meta name="description" content="JBB FILM — 电影级视觉叙事与沉浸式创意表达的影视工作室。Cinematic creative studio focused on immersive storytelling.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
overflow-x:hidden;
background:
radial-gradient(circle at 20% 20%, #ff2bd620, transparent 40%),
radial-gradient(circle at 80% 30%, #00d4ff15, transparent 45%),
radial-gradient(circle at 50% 80%, #7c3aed15, transparent 50%),
#050505;
color:white;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
z-index:999;
background:rgba(0,0,0,.35);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.06);
}

.nav-inner{
max-width:1400px;
margin:auto;
padding:22px 30px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:22px;
font-weight:900;
letter-spacing:.35em;
}

nav{
display:flex;
gap:26px;
}

nav a{
text-decoration:none;
color:rgba(255,255,255,.7);
font-size:14px;
transition:.3s;
}

nav a:hover{
color:white;
}

.lang-box{
position:relative;
}

.lang-btn{
width:46px;
height:46px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
}

.lang-list{
position:absolute;
top:60px;
right:0;
width:220px;
z-index:600;
border-radius:20px;
overflow:hidden;
background:rgba(0,0,0,.95);
border:1px solid rgba(255,255,255,.08);
display:none;
backdrop-filter:blur(20px);
}

.lang-list div{
padding:14px 18px;
cursor:pointer;
transition:.3s;
}

.lang-list div:hover{
background:rgba(255,255,255,.08);
}

section{
padding:120px 24px;
}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero h1{
font-size:110px;
font-weight:900;
}

.hero p{
margin-top:22px;
font-size:18px;
color:rgba(255,255,255,.68);
}

.title{
font-size:56px;
font-weight:900;
text-align:center;
}

.sub{
max-width:1000px;
margin:24px auto;
text-align:center;
line-height:1.9;
color:rgba(255,255,255,.72);
}

.card{
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
backdrop-filter:blur(24px);
overflow:hidden;
transition:.45s;
}

.card:hover{
transform:translateY(-10px) scale(1.02);
}

.team-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:28px;
max-width:1400px;
margin:70px auto 0;
}

.team-card{
display:flex;
gap:26px;
padding:28px;
position:relative;
min-height:260px;
}

.team-card img{
width:180px;
height:100%;
object-fit:cover;
border-radius:24px;
}

.tooltip{
display:inline-block;
margin-top:4px;
padding:8px 14px;
font-size:12px;
border-radius:999px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.1);
}

.member-name{
font-size:32px;
font-weight:800;
}

.member-desc{
margin-top:18px;
line-height:1.9;
color:rgba(255,255,255,.72);
}

.film-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:26px;
max-width:1400px;
margin:70px auto 0;
}

.film-grid img{
width:100%;
height:280px;
object-fit:cover;
}

.location-wrap{
position:relative;
height:560px;
overflow:hidden;
border-radius:34px;
max-width:1400px;
margin:70px auto 0;
}

.location-slide{
position:absolute;
inset:0;
opacity:0;
transition:opacity 1.8s ease;
}

.location-slide.active{
opacity:1;
}

.location-slide img{
width:100%;
height:100%;
object-fit:cover;
animation:zoom 7s linear forwards;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.12);}
}

.location-overlay{
position:absolute;
inset:0;
background:
linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.12)),
linear-gradient(to right, rgba(0,0,0,.5), transparent 60%);
z-index:2;
}

.location-info{
position:absolute;
left:60px;
bottom:60px;
z-index:3;
max-width:760px;
}

.location-tag{
display:inline-block;
padding:8px 16px;
border-radius:999px;
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.14);
margin-bottom:20px;
font-size:13px;
letter-spacing:.2em;
}

.location-info h3{
font-size:74px;
font-weight:900;
line-height:1;
}

.location-info p{
margin-top:22px;
line-height:1.9;
color:rgba(255,255,255,.72);
}

.contact-wrap{
max-width:900px;
margin:70px auto 0;
}

.contact-wrap input,
.contact-wrap textarea{
width:100%;
padding:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
margin-bottom:18px;
color:white;
outline:none;
}

.contact-wrap textarea{
min-height:180px;
resize:none;
}

.contact-wrap button{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:white;
color:black;
font-weight:800;
cursor:pointer;
transition:.3s;
}

@media(max-width:900px){

.hero h1{
font-size:68px;
}

nav{
display:none;
}

.team-grid{
grid-template-columns:1fr;
}

.film-grid{
grid-template-columns:1fr;
}

.location-info{
left:30px;
right:30px;
bottom:40px;
}

.location-info h3{
font-size:42px;

}

}

/* ── 白天模式 ── */
body,header,nav a,.card,.sp-card,.lang-btn,.lang-list,.tooltip,input,textarea,button,.title,.sub,.member-desc,.hero p,.location-overlay,.location-tag,.location-info h3,.location-info p{transition:all .5s ease}
.light body,html.light body{background:#f4f4f5;color:#111}
html.light header,.light header{background:rgba(255,255,255,.82);border-bottom:1px solid rgba(0,0,0,.06)}
html.light nav a,.light nav a{color:rgba(0,0,0,.65)}html.light nav a:hover,.light nav a:hover{color:#000}
html.light .hero p,.light .hero p{color:rgba(0,0,0,.55)}
html.light .title,.light .title{color:#111}
html.light .sub,.light .sub{color:rgba(0,0,0,.58)}
html.light .card,.light .card{background:#fff;border:1px solid rgba(0,0,0,.08)}
html.light .card:hover,.light .card:hover{box-shadow:0 12px 40px rgba(0,0,0,.08)}
html.light .lang-btn,.light .lang-btn{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.1);color:#333}
html.light .lang-list,.light .lang-list{background:rgba(255,255,255,.96);border-color:rgba(0,0,0,.08)}
html.light .lang-list div:hover,.light .lang-list div:hover{background:rgba(0,0,0,.04)}
html.light .member-desc,.html.light section p,.light .member-desc,.light section p{color:rgba(0,0,0,.6)}
html.light .tooltip,.light .tooltip{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.1);color:#333}
html.light .location-overlay,.light .location-overlay{background:none}
html.light .location-tag,.light .location-tag{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.1);color:#333}
html.light .location-info h3,.html.light .location-info p,.light .location-info h3,.light .location-info p{color:#111}
html.light .sp-card,.light .sp-card{background:#e8e8ea;border-color:rgba(0,0,0,.1)}
html.light .sp-card:hover,.light .sp-card:hover{background:#ddd}
html.light input,.html.light textarea,.light input,.light textarea{background:#fff;border:1px solid rgba(0,0,0,.15);color:#111}
html.light input::placeholder,.html.light textarea::placeholder,.light input::placeholder,.light textarea::placeholder{color:rgba(0,0,0,.35)}
html.light button[type=submit],.light button[type=submit]{background:#111;color:#fff}


/* ── 视频弹窗 ── */
.video-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.video-overlay.active{opacity:1;pointer-events:auto}
.video-overlay video{max-width:95vw;max-height:90vh;border-radius:12px}
.video-close{position:absolute;top:28px;right:32px;font-size:36px;color:white;cursor:pointer;z-index:100000;background:none;border:none;opacity:.7;transition:.3s}
.video-close:hover{opacity:1;transform:scale(1.15)}
.sp-card{background:#1a1a1a}.sp-card:hover{background:#222}

</style>
</head>

function toggleLang(){

const list=document.getElementById('langList');

list.style.display=
list.style.display==='block'
?'none'
:'block';

}

function setLang(lang){

currentLang=lang;

document.querySelectorAll('[data-i18n]').forEach(el=>{

const key=el.dataset.i18n;

if(translations[lang][key]){
el.innerText=translations[lang][key];
}

});

for(let i=0;i<8;i++){

document.getElementById(`team${i}_role`).innerText=
translations[lang][`team${i}_role`];

document.getElementById(`team${i}_desc`).innerText=
translations[lang][`team${i}_desc`];

}

document.getElementById('contact-name').placeholder=
translations[lang].placeholder_name;

document.getElementById('contact-email').placeholder=
translations[lang].placeholder_email;

document.getElementById('contact-message').placeholder=
translations[lang].placeholder_message;

document.getElementById('langList').style.display='none';

}

setLang('zh');

const slides=document.querySelectorAll('.location-slide');

let current=0;

setInterval(()=>{

slides[current].classList.remove('active');

current++;

if(current>=slides.length){
current=0;
}

slides[current].classList.add('active');

},3500);

function sendMail(){

const name=document.getElementById('contact-name').value.trim();

const email=document.getElementById('contact-email').value.trim();

const message=document.getElementById('contact-message').value.trim();

if(!name || !email || !message){

alert(currentLang==='en'
?'Please complete all fields'
:'请完整填写信息');

return;

}

const btn=document.getElementById('send-btn');

btn.disabled=true;

btn.innerText=

<!-- 视频弹窗 -->
<div class="video-overlay" id="videoOverlay" onclick="closeVideo()">
<button class="video-close" onclick="closeVideo()">✕</button>
<video id="modalVideo" controls onclick="event.stopPropagation()" onended="onVideoEnd()"></video>
</div>

<script>
// ── 音乐控制 ──
let musicOn = false;
const bgm = document.getElementById("bgm");
const btn = document.getElementById("musicBtn");
function toggleMusic(){
  if(!musicOn){ bgm.play(); btn.innerText = "🎵"; musicOn = true; }
  else{ bgm.pause(); btn.innerText = "💿"; musicOn = false; }
}
// 音乐淡入/淡出
function fadeOutMusic(){ if(!musicOn||!bgm)return; var v=bgm.volume,s=setInterval(function(){v-=.05;if(v<=0){bgm.pause();bgm.volume=0;clearInterval(s)}else{bgm.volume=v}},50) }
function fadeInMusic(){ if(!musicOn||!bgm)return; bgm.currentTime=bgm.currentTime||0;bgm.volume=0;bgm.play();var v=0,s=setInterval(function(){v+=.05;if(v>=1){bgm.volume=1;clearInterval(s)}else{bgm.volume=v}},50) }

// ── 视频弹窗 ──
function openVideo(src){
  var ov=document.getElementById("videoOverlay");
  var v=document.getElementById("modalVideo");
  v.src=src;
  fadeOutMusic();  // 开始淡出,不等待
  setTimeout(function(){ov.classList.add("active");v.play()},500);  // 0.5s后弹视频
}
function closeVideo(){
  var ov=document.getElementById("videoOverlay");
  var v=document.getElementById("modalVideo");
  ov.classList.remove("active");
  v.pause(); v.src="";
  fadeInMusic();
}
function onVideoEnd(){
  var ov=document.getElementById("videoOverlay");
  ov.classList.remove("active");
  fadeInMusic();
}
</script>

</body>
</html>
